<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .header-controls { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; width: 95%; max-width: 1400px; }
        select { padding: 10px; border-radius: 5px; background-color: #1e1e1e; color: white; border: 1px solid #f3ba2f; font-size: 1.1em; cursor: pointer; outline: none; }
        .dashboard-container { display: flex; width: 95%; max-width: 1400px; gap: 20px; }
        .card { background-color: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); flex: 1; position: relative; }
        #gauge-container { width: 100%; height: 350px; }
        #line-chart-container { width: 100%; height: 250px; margin-top: 10px; }
        h1 { color: #f3ba2f; margin: 0; }
        .sentiment-badge { padding: 5px 15px; border-radius: 20px; font-weight: bold; background-color: #333; }
        .price-percentage { font-size: 1.2em; font-weight: bold; margin-left: 15px; padding: 5px 10px; border-radius: 8px; background-color: #2a2a2a; }

        /* Estilos para la nueva Alerta de Volatilidad */
        #volatility-alert {
            display: none;
            background-color: #ff4d4f;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
<div class="header-controls">
    <h1>Dashboard Analítico</h1>
    <select id="crypto-selector" onchange="cambiarMoneda()">
        <option value="">Cargando monedas...</option>
    </select>
</div>

<div class="dashboard-container">
    <div class="card">
        <div id="volatility-alert">⚠️ ALERTA DE VOLATILIDAD DETECTADA</div>

        <h2>Índice de Pearson: <span id="coin-title">...</span></h2>

        <div style="text-align: center; margin: 15px 0; display: flex; align-items: center; justify-content: center;">
            <span id="price-text" style="font-size: 2.5em; font-weight: bold; color: #f3ba2f;">0.00 €</span>
            <span id="price-change" class="price-percentage">---</span>
        </div>
        <div style="text-align: center; margin-bottom: 15px;">
            <span id="update-text" style="color: #888; font-size: 0.8em;">Última actualización: ---</span>
        </div>

        <p>Sentimiento detectado: <span id="sentiment-text" class="sentiment-badge">Cargando...</span></p>

        <div id="gauge-container"></div>
        <div id="line-chart-container"></div>
    </div>

    <div class="card">
        <h2>Muro de Noticias e Historial</h2>
        <div id="alerts-wall" style="height: 600px; overflow-y: auto;">
            <span style="color: #00ff00; font-family: monospace;">> Conectado... Esperando datos...</span>
        </div>
    </div>
</div>

<script>
    var chartDom = document.getElementById('gauge-container');
    var myChart = echarts.init(chartDom, 'dark');
    var optionGauge = {
        backgroundColor: 'transparent',
        series: [{
            type: 'gauge', min: -1, max: 1, splitNumber: 4,
            axisLine: { lineStyle: { width: 20, color: [[0.3, '#ff4d4f'], [0.7, '#faad14'], [1, '#52c41a']] } },
            detail: { formatter: '{value}', fontSize: 35 },
            data: [{ value: 0, name: 'Pearson' }]
        }]
    };
    myChart.setOption(optionGauge);

    var lineDom = document.getElementById('line-chart-container');
    var lineChart = echarts.init(lineDom, 'dark');

    function cargarListaMonedas() {
        fetch('/api/monedas')
            .then(response => response.json())
            .then(monedas => {
                const selector = document.getElementById('crypto-selector');
                selector.innerHTML = '';
                monedas.forEach(moneda => {
                    const option = document.createElement('option');
                    option.value = moneda;
                    option.textContent = moneda.toUpperCase();
                    selector.appendChild(option);
                });
                if (monedas.length > 0) cargarDatos();
            })
            .catch(error => console.error('Error cargando monedas:', error));
    }

    function cargarDatos() {
        const cryptoId = document.getElementById('crypto-selector').value;
        if (!cryptoId) return;

        document.getElementById('coin-title').innerText = cryptoId.toUpperCase();

        fetch('/api/indicadores/' + cryptoId)
            .then(response => response.json())
            .then(data => {
                // 1. Mapeo de nuevos nombres de Java a HTML
                document.getElementById('price-text').innerText = data.currentPrice.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 6 }) + " €";
                document.getElementById('update-text').innerText = "Última actualización: " + data.lastTimestamp;
                document.getElementById('sentiment-text').innerText = data.sentimentText;

                // 2. Gestionar Alerta de Volatilidad
                const alertEl = document.getElementById('volatility-alert');
                alertEl.style.display = data.isVolatile ? 'block' : 'none';

                // 3. Gestionar Porcentaje de Cambio (Ahora viene calculado de Java)
                const changeEl = document.getElementById('price-change');
                const pChange = data.priceChange;

                if (pChange > 0) {
                    changeEl.innerText = "▲ +" + pChange.toFixed(2) + "%";
                    changeEl.style.color = "#52c41a";
                } else if (pChange < 0) {
                    changeEl.innerText = "▼ " + pChange.toFixed(2) + "%";
                    changeEl.style.color = "#ff4d4f";
                } else {
                    changeEl.innerText = "0.00%";
                    changeEl.style.color = "#888";
                }

                // 4. Actualizar Velocímetro de Pearson
                myChart.setOption({ series: [{ data: [{ value: data.pearson.toFixed(2), name: 'Pearson' }] }] });

                // 5. Actualizar Gráfica de Líneas
                lineChart.setOption({
                    backgroundColor: 'transparent',
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: data.timestampHistory, show: false },
                    yAxis: { type: 'value', scale: true, splitLine: { lineStyle: { color: '#333' } } },
                    series: [{
                        data: data.priceHistory,
                        type: 'line', smooth: true, symbol: 'none',
                        lineStyle: { color: '#f3ba2f', width: 3 },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(243, 186, 47, 0.5)' },
                                { offset: 1, color: 'rgba(243, 186, 47, 0)' }
                            ])
                        }
                    }]
                });
            });

        // Noticias (Petición 2)
        fetch('/api/noticias/' + cryptoId)
            .then(response => response.json())
            .then(noticias => {
                const muro = document.getElementById('alerts-wall');
                muro.innerHTML = '';
                if (noticias.length === 0) {
                    muro.innerHTML = '<span style="color: #888;">> Sin noticias recientes.</span>';
                    return;
                }
                noticias.forEach(noticia => {
                    const partes = noticia.split(" -> ");
                    const divNoticia = document.createElement('div');
                    divNoticia.style = "background-color: #2a2a2a; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #f3ba2f;";
                    divNoticia.innerHTML = `
                        <strong style="color: #ffffff; font-size: 1.1em;">${partes[0]}</strong><br>
                        <a href="${partes[1] || '#'}" target="_blank" style="color: #52c41a; text-decoration: none; font-size: 0.9em; display: inline-block; margin-top: 8px;">
                            Leer artículo completo ↗
                        </a>`;
                    muro.appendChild(divNoticia);
                });
            });
    }

    function cambiarMoneda() {
        myChart.showLoading();
        lineChart.showLoading();
        cargarDatos();
        setTimeout(() => {
            myChart.hideLoading();
            lineChart.hideLoading();
        }, 400);
    }

    const socket = new WebSocket("ws://" + location.host + "/ws");
    socket.onmessage = (event) => { if (event.data === "update") cargarDatos(); };

    cargarListaMonedas();
</script>
</body>
</html>
